<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarah Martinez - Online Clothes Shopping Journey</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>

<body>

          '-2': { emoji: '😫', color: '#f44336', label: 'Very Negative' },

          '2': { emoji: '😄', color: '#4caf50', label: 'Very Positive' }

        return emotions[intensity.toString()] || emotions['0'];

                name: "Receive promotional notification",

                channels: [{ type: "app", name: "StyleMart App" }],
                barriers: [],
                opportunities: ["Personalize notification based on browsing history", "Include specific product recommendations"]

              {

                channels: [{ type: "app", name: "StyleMart App" }],
                barriers: [
                  { type: "knowledge", description: "Difficult to assess fabric quality from photos alone", severity: 3 },

              },
              {

              {
                id: "check-sizing",
                name: "Check sizing information",

                channels: [{ type: "app", name: "StyleMart App" }],
                barriers: [

                barriers: [

                emotion: { state: "disappointed", intensity: -1 },
                channels: [{ type: "in_person", name: "Trying on at home" }],

                opportunities: ["Offer virtual try-on technology", "Provide body-shape specific recommendations", "Better sizing prediction based on purchase history"]
              },
              {
                id: "decide-to-return",
                name: "Decide to return",
                actions: ["Considers whether to keep it anyway", "Checks if different size is available", "Sees size 12 is sold out", "Decides to return"],
                thoughts: "Such a shame, I really love the color. Size 12 might have worked but it's sold out now. I can't keep something that doesn't fit properly - it'll just hang in my wardrobe.",
                emotion: { state: "resigned", intensity: -1 },
                channels: [{ type: "app", name: "StyleMart App" }],

                thoughts: "Good, I can drop it at the locker near work. That's easy - I'll do it tomorrow on my lunch break.",

              },
              {
                id: "drop-off-return",
                name: "Drop off at locker",
                actions: ["Goes to locker location during lunch", "Opens app to display QR code", "Scans QR code at locker", "Locker door opens", "Places package in locker", "Receives confirmation notification"],

              },
              {

                actions: ["Receives notification that return is being processed", "Opens app to check status", "Sees 'Return received - refund processing'"],
                thoughts: "Good, they've got it. Now I just need to wait for the refund.",
                emotion: { state: "reassured", intensity: 0 },

                barriers: [{ type: "communications", description: "No specific timeframe given for refund processing", severity: 2 }],

              },
              {

                barriers: [],
                opportunities: ["Include personalized recommendations in refund confirmation", "Offer incentive for next purchase"]
              }
            ]
          }
        ]
      };

      // Flatten all steps for easier rendering
      const allSteps = journeyData.phases.flatMap((phase, phaseIndex) =>
        phase.steps.map(step => ({ ...step, phaseIndex, phaseName: phase.name }))

      return (
        <div style={{ fontFamily: 'system-ui, -apple-system, sans-serif', padding: '20px', maxWidth: '100%' }}>

                    zIndex: 10,
                    borderRight: '2px solid #e0e0e0',
                    borderBottom: '1px solid #eee'
                  }}>Channels</td>
                  {journeyData.phases.flatMap((phase, phaseIndex) =>
                    phase.steps.map((step, stepIndex) => (
                      <td
                        key={`${step.id}-channels`}
                        style={{
                          padding: '10px 12px',
                          borderBottom: '1px solid #eee',
                          borderLeft: stepIndex === 0 ? `4px solid ${phaseColors[phaseIndex % phaseColors.length]}` : '1px solid #eee',
                          verticalAlign: 'top',
                          fontSize: '11px'
                        }}
                      >
                        {step.channels.map((channel, i) => (
                          <div
                            key={i}
                            style={{
                              display: 'inline-block',
                              padding: '3px 8px',
                              marginRight: '4px',
                              marginBottom: '4px',
                              backgroundColor: channel.type === 'app' ? '#e3f2fd' :
                                              channel.type === 'email' ? '#fce4ec' :
                                              channel.type === 'in_person' ? '#e8f5e9' : '#f5f5f5',
                              borderRadius: '12px',
                              fontSize: '10px',
                              fontWeight: '500',
                              color: channel.type === 'app' ? '#1565c0' :
                                     channel.type === 'email' ? '#c2185b' :
                                     channel.type === 'in_person' ? '#2e7d32' : '#666'
                            }}
                          >
                            {channel.name || channel.type}
                          </div>
                        ))}
                      </td>
                    ))
                  )}
                </tr>

                {/* Barriers Lane */}
                <tr>
                  <td style={{
                    padding: '12px 16px',
                    backgroundColor: '#fafafa',
                    fontWeight: '600',
                    fontSize: '11px',
                    color: '#555',
                    textTransform: 'uppercase',
                    letterSpacing: '0.5px',
                    position: 'sticky',
                    left: 0,
                    zIndex: 10,
                    borderRight: '2px solid #e0e0e0',
                    borderBottom: '1px solid #eee'
                  }}>Barriers</td>
                  {journeyData.phases.flatMap((phase, phaseIndex) =>
                    phase.steps.map((step, stepIndex) => (
                      <td
                        key={`${step.id}-barriers`}
                        style={{
                          padding: '10px 12px',
                          borderBottom: '1px solid #eee',
                          borderLeft: stepIndex === 0 ? `4px solid ${phaseColors[phaseIndex % phaseColors.length]}` : '1px solid #eee',
                          verticalAlign: 'top',
                          fontSize: '11px',
                          backgroundColor: step.barriers.length > 0 ? '#fff8e1' : 'transparent'
                        }}
                      >
                        {step.barriers.map((barrier, i) => (
                          <div
                            key={i}
                            style={{
                              padding: '6px 8px',
                              marginBottom: '4px',
                              backgroundColor: '#fff3e0',
                              borderLeft: `3px solid ${barrier.severity >= 4 ? '#f44336' : barrier.severity >= 3 ? '#ff9800' : '#ffc107'}`,
                              borderRadius: '0 4px 4px 0',
                              fontSize: '10px',
                              lineHeight: '1.4'
                            }}
                          >
                            <strong style={{
                              textTransform: 'uppercase',
                              fontSize: '9px',
                              color: barrier.severity >= 4 ? '#c62828' : barrier.severity >= 3 ? '#e65100' : '#f57c00',
                              letterSpacing: '0.3px'
                            }}>
                              {barrier.type}
                            </strong>
                            <div style={{ color: '#555', marginTop: '2px' }}>{barrier.description}</div>
                          </div>
                        ))}
                      </td>
                    ))
                  )}
                </tr>

                {/* Opportunities Lane */}
                <tr>
                  <td style={{
                    padding: '12px 16px',
                    backgroundColor: '#fafafa',
                    fontWeight: '600',
                    fontSize: '11px',
                    color: '#555',
                    textTransform: 'uppercase',
                    letterSpacing: '0.5px',
                    position: 'sticky',
                    left: 0,
                    zIndex: 10,
                    borderRight: '2px solid #e0e0e0'
                  }}>Opportunities</td>
                  {journeyData.phases.flatMap((phase, phaseIndex) =>
                    phase.steps.map((step, stepIndex) => (
                      <td
                        key={`${step.id}-opps`}
                        style={{
                          padding: '10px 12px',
                          borderLeft: stepIndex === 0 ? `4px solid ${phaseColors[phaseIndex % phaseColors.length]}` : '1px solid #eee',
                          verticalAlign: 'top',
                          fontSize: '10px',
                          backgroundColor: step.opportunities.length > 0 ? '#e8f5e9' : 'transparent'
                        }}
                      >
                        {step.opportunities.length > 0 && (
                          <ul style={{ margin: 0, paddingLeft: '14px', color: '#2e7d32' }}>
                            {step.opportunities.map((opp, i) => (
                              <li key={i} style={{ marginBottom: '3px' }}>{opp}</li>
                            ))}
                          </ul>
                        )}
                      </td>
                    ))
                  )}
                </tr>
              </tbody>
            </table>
          </div>

          {/* Legend */}
          <div style={{ marginTop: '24px', padding: '16px', backgroundColor: '#fff', borderRadius: '8px', border: '1px solid #e0e0e0' }}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '32px' }}>
              <div>
                <h3 style={{ margin: '0 0 10px', fontSize: '12px', color: '#333', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Emotion Scale</h3>
                <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
                  {['-2', '-1', '0', '1', '2'].map(intensity => {
                    const e = getEmotionDisplay(parseInt(intensity));
                    return (
                      <div key={intensity} style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>
                        <span style={{ fontSize: '16px' }}>{e.emoji}</span>
                        <span style={{ fontSize: '11px', color: '#666' }}>{intensity}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
              <div>
                <h3 style={{ margin: '0 0 10px', fontSize: '12px', color: '#333', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Channel Types</h3>
                <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                  {[
                    { type: 'App', color: '#e3f2fd', textColor: '#1565c0' },
                    { type: 'Email', color: '#fce4ec', textColor: '#c2185b' },
                    { type: 'In-person', color: '#e8f5e9', textColor: '#2e7d32' }
                  ].map(ch => (
                    <span key={ch.type} style={{
                      padding: '3px 8px',
                      backgroundColor: ch.color,
                      borderRadius: '12px',
                      fontSize: '10px',
                      fontWeight: '500',
                      color: ch.textColor
                    }}>
                      {ch.type}
                    </span>
                  ))}
                </div>
              </div>
              <div>
                <h3 style={{ margin: '0 0 10px', fontSize: '12px', color: '#333', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Barrier Severity</h3>
                <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap', fontSize: '10px', color: '#666' }}>
                  <span><span style={{ color: '#ffc107', fontWeight: 'bold' }}>●</span> Low (1-2)</span>
                  <span><span style={{ color: '#ff9800', fontWeight: 'bold' }}>●</span> Medium (3)</span>
                  <span><span style={{ color: '#f44336', fontWeight: 'bold' }}>●</span> High (4-5)</span>
                </div>
              </div>
            </div>
          </div>

          {/* Summary Stats */}
          <div style={{ marginTop: '16px', padding: '16px', backgroundColor: '#f5f5f5', borderRadius: '8px', display: 'flex', gap: '32px', flexWrap: 'wrap' }}>
            <div>
              <div style={{ fontSize: '24px', fontWeight: '600', color: '#2196F3' }}>{journeyData.phases.length}</div>
              <div style={{ fontSize: '11px', color: '#666', textTransform: 'uppercase' }}>Phases</div>
            </div>
            <div>
              <div style={{ fontSize: '24px', fontWeight: '600', color: '#9C27B0' }}>{allSteps.length}</div>
              <div style={{ fontSize: '11px', color: '#666', textTransform: 'uppercase' }}>Steps</div>
            </div>
            <div>
              <div style={{ fontSize: '24px', fontWeight: '600', color: '#FF9800' }}>
                {allSteps.reduce((sum, step) => sum + step.barriers.length, 0)}
              </div>
              <div style={{ fontSize: '11px', color: '#666', textTransform: 'uppercase' }}>Barriers Identified</div>
            </div>
            <div>
              <div style={{ fontSize: '24px', fontWeight: '600', color: '#4CAF50' }}>
                {allSteps.reduce((sum, step) => sum + step.opportunities.length, 0)}
              </div>
              <div style={{ fontSize: '11px', color: '#666', textTransform: 'uppercase' }}>Opportunities</div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<JourneyMap />);
  </script>
</body>
</html>
